[package]
name = "tessera-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Terminal front-end for Tessera: ratatui screens, input state machine, clipboard"

[dependencies]
tessera-core = { path = "../tessera-core" }
ratatui = "0.30"
crossterm = "0.29"
serde_json = "1"
toml = "1"

[dev-dependencies]
tempfile = "3"
