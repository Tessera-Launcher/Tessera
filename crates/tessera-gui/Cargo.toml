[package]
name = "tessera-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Desktop front-end for Tessera, built on gpui-kit"

[[bin]]
name = "tessera-gui"
path = "src/main.rs"

[dependencies]
tessera-core = { path = "../tessera-core" }
gpui-kit = "0.9.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
