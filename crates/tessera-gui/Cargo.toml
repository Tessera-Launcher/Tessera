[package]
name = "tessera-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-or-later"
description = "Desktop front-end for Tessera, built on gpui-kit"
publish = false

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
tessera-core = { path = "../tessera-core" }
gpui-kit = "0.9.0"
futures = "0.3"
# Decompress the embedded bitmap font at startup instead of storing the raw 15 MB OTF.
flate2 = "1"
# 在系统文件管理器里打开目录（Explorer / Finder / xdg-open）。
open = "5.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
