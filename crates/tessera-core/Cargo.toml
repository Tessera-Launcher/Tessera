[package]
name = "tessera-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Core logic for Tessera: version discovery, launch assembly, downloads, Java runtimes, accounts, cleanup"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha1 = "0.11"
hex = "0.4"
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
minecraft-auth = { path = "../../vendor/minecraft-auth" }
mdt-minecraft = { path = "../../vendor/mdt-minecraft" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
tokio = { version = "1", features = ["rt", "time", "sync"] }

[dev-dependencies]
tempfile = "3"
