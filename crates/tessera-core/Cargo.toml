[package]
name = "tessera-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-or-later"
description = "Core logic for Tessera: version discovery, launch assembly, downloads, Java runtimes, accounts, cleanup"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha1 = "0.11"
hex = "0.4"
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
minecraft-auth = { path = "../../vendor/minecraft-auth" }
mdt-minecraft = { path = "../../vendor/mdt-minecraft" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
tokio = { version = "1", features = ["rt", "time", "sync"] }
# Ogg Vorbis only: the game ships nothing else, and `default-features = false`
# keeps flac/mp3/mp4/wav and the recording API out of the binary entirely.
rodio = { version = "0.23", default-features = false, features = ["playback", "vorbis"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
# Directory junctions are the Windows link that does not need
# SeCreateSymbolicLinkPrivilege; symlink_dir is only the fallback.
junction = { version = "2.1", default-features = false }

[dev-dependencies]
tempfile = "3"
