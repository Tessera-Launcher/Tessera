[workspace]
members = ["mdt-macros"]

[package]
name = "mdt-minecraft"
version = "0.7.0"
edition = "2021"
rust-version = "1.85.0"
description = "Minecraft Download Toolkit - an ergonomic, low-level library for downloading and installing Minecraft versions and mod loaders."
license = "MIT"
repository = "https://github.com/Lavaver/Minecraft-Download-Toolkit"
homepage = "https://github.com/Lavaver/Minecraft-Download-Toolkit"
documentation = "https://docs.rs/mdt-minecraft"
keywords = ["minecraft", "launcher", "downloader", "modloader", "forge"]
categories = ["game-development", "api-bindings"]
readme = "README.md"

[lib]
name = "mdt"

[features]
default = ["tokio"]
tokio = ["dep:tokio", "dep:reqwest"]
blocking = ["dep:ureq"]
# Opt-in: HTTP/2 multiplexing (see `http.rs` — it measured half speed for assets).
http2 = ["reqwest?/http2"]
minimal = []
cli = ["tui", "dep:clap"]
tui = ["dep:crossterm", "dep:ratatui"]

[dependencies]
mdt-macros = { version = "0.4.3", path = "mdt-macros" }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "fs", "io-util", "time"], optional = true }
# `default-features = false`: upstream took reqwest's defaults, which include
# `http2`. HTTP/1.1 is the faster transport for Minecraft assets (see
# `VENDORED.md` section 6), so h2 is opt-in through this crate's `http2` feature
# instead of compiled in for everyone. `charset` and `system-proxy` are kept
# because the code relies on `Response::text()` decoding and on picking up the
# ambient proxy configuration.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "charset", "system-proxy"], optional = true }
ureq = { version = "2.10", features = ["json"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
quick-xml = { version = "0.42.0", features = ["serialize"] }
sha1 = "0.11.0"
sha2 = "0.11"
hex = "0.4.3"
zip = "9.0.5"
futures = "0.3.34"
thiserror = "2.0"
toml = "1.1.8"

clap = { version = "4.6.7", features = ["derive"], optional = true }
crossterm = { version = "0.29.0", optional = true }
ratatui = { version = "0.30.2", optional = true }

[dev-dependencies]
# The library takes TLS from whoever enables it (feature unification); the
# crate's own tests talk to https mirrors, so they have to ask for it here.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde_json = "1.0.154"
tempfile = "3"
wiremock = "0.6"
