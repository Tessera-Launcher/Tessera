name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design:
    name: Design tokens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install design tooling
        run: npm ci --ignore-scripts

      - name: Validate tokens, preview and tests
        run: npm run check

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  windows:
    name: Windows build and test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Registry and bin caches only. This action drops the build artifacts
          # of every package whose manifest lives inside the workspace root,
          # which is exactly what the `vendor/` path patches are, so a target
          # directory saved by it can never be reused by the next run.
          cache-targets: false

      - name: Restore Rust build artifacts
        id: rust-target
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          # Rolling key: every run saves a fresh entry, so the restored target
          # directory always contains what the previous run built. The prefix
          # only covers dependency inputs (lockfile, vendored manifests,
          # toolchain) so a restore never crosses a dependency change.
          key: rust-target-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'vendor/**/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            rust-target-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'vendor/**/Cargo.toml', 'rust-toolchain.toml') }}-
            rust-target-${{ runner.os }}-${{ github.job }}-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build release binary
        run: cargo build --release --locked -p tessera-gui

      - name: Save Rust build artifacts
        # Rolling keys add a new entry per run, so only the default branch may
        # write: pull requests restore them but never grow the cache quota.
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.rust-target.outputs.cache-primary-key }}

      - name: Pack the executable with UPX
        shell: pwsh
        run: ./scripts/pack-upx.ps1 target/release/tessera.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tessera-Windows-x64
          path: target/release/tessera.exe
          archive: false
          retention-days: 14
          if-no-files-found: error

  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false

      - name: Restore Rust build artifacts
        id: rust-target
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: rust-target-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'vendor/**/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            rust-target-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'vendor/**/Cargo.toml', 'rust-toolchain.toml') }}-
            rust-target-${{ runner.os }}-${{ github.job }}-

      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Test core
        run: cargo test -p tessera-core --locked

      - name: Save Rust build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.rust-target.outputs.cache-primary-key }}

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check advisories, bans and sources
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --all-features
          command-arguments: advisories bans sources
